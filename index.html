<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <!-- DevIcons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <!-- Styles CSS -->
  <link rel="stylesheet" href="styles/new_css.css">
</head>
<body>
  
  <!-- ============================== Sidebar ============================== -->
    <!-- Sidebar Open - Close Button -->
    <button class="sidebar__btn" id="sidebarBtn"> ☰ </button>
    
    <nav class="sidebar" id="sidebar">
      <div class="sidebar__header"></div>
      <!-- List Options -->
      <ul class="sidebar__menu">
        <li class="sidebar__link active__link" onclick="Navigate(0)">Home</li>
        <li class="sidebar__link" onclick="Navigate(1)">About Me</li>
        <li class="sidebar__link" onclick="Navigate(2)">Services</li>
        <li class="sidebar__link" onclick="Navigate(3)">Projects</li>
        <li class="sidebar__link" onclick="Navigate(4)">Contact Me</li>
      </ul>
      <!-- Theme Buttons  -->
      <div class="sidebar__footer">
        <button class="sidebar__theme-btn">
          <img src="assets/icons/light.ico" alt="Theme Icon" srcset="">
        </button>
      </div>
    </nav>

  <!-- ============================== Swiper ============================== -->
  <!-- Slider main container -->
  <div class="swiper">
    <!-- Additional required wrapper -->
    <div class="swiper-wrapper">
      <!-- ============================== Home ============================== -->
      <!-- Slide -->
      <div class="swiper-slide">
        <section class="section" id="home">
          <!-- Hero Content -->
          <div class="section__container">
            <section class="section__content">
              <!-- Column 1 -->
              <div class="content__left">
                <img src="assets/images/profile.png" alt="Profile Photo">
              </div>
              <!-- Column 2 -->
              <div class="content__right">
                  <h1>Hi, I'm <span>Sebastian</span>,</h1>
                  <h2>A <span class="sec-text">Freelancer</span></h2>
                  <p> Focused on designing and building scalable systems, with experience in web, mobile, and interactive 3D environments. </p>
                  <!-- Hero Buttons -->
                  <div class="home__options">
                    <button class="btn primary">Hire Me</button>
                    <button class="btn secondary">Contact Me</button>
                  </div>
              </div>
            </section>
          </div>
        </section>
      </div>

      <div class="swiper-slide">
        <section class="section" id="about">
          Slide 2
        </section>
      </div>

      <div class="swiper-slide">
        <section class="section" id="services">
          Slide 3
        </section>
      </div>

      <div class="swiper-slide">
        <section class="section" id="projects">
          Slide 4
        </section>
      </div>

      <div class="swiper-slide">
        <section class="section" id="contact">
          Slide 5
        </section>
      </div>


    </div>
    <!-- Pagination -->
    <div class="swiper-pagination"></div>

    <!-- If we need navigation buttons 
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>-->
    

    <!-- If we need scrollbar -->
    <div class="swiper-scrollbar"></div>
  
  
  </div>

  <script src="main/swiper.js"></script>
  <script src="main/sidebar.js"></script>
  <script src="main/typing.js"></script>
  <script src="main/theme.js"></script>
  
</body>
</html>
